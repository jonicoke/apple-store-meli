services:
  backend:
    build: .
    ports: 
      - "8080:8080"

    environment:
      MELI_CLIENT_ID: ${MELI_CLIENT_ID}
      MELI_CLIENT_SECRET: ${MELI_CLIENT_SECRET}
      MELI_ACCESS_TOKEN: ${MELI_ACCESS_TOKEN}
      MELI_REFRESH_TOKEN: ${MELI_REFRESH_TOKEN}
      MELI_EXPIRES_AT: ${MELI_EXPIRES_AT}

    volumes:
      - ./data:/app/data